name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 说明：后端是仓颉（Cangjie 1.0.5）工程，编译需要本地安装 cangjie-sdk 与 cangjie-stdx，
# GitHub 托管 runner 上没有预装，因此本流水线只覆盖前端。后端改动请按
# COLLABORATOR_GUIDE.md 第二、五节在本地执行 cjpm build 自测后再提交。

jobs:
  frontend:
    name: 前端类型检查 / 单元测试 / 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-web
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend-web/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查（含 .vue）
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      - name: 生产构建
        run: pnpm build
